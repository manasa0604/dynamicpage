<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ECS Deployment Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9fafb;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #1e40af;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 10px auto;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 800px;
    }
    .status {
      font-weight: bold;
      color: green;
    }
    canvas {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🚀 ECS Deployment Status</h1>

  <div class="card">
    <p><b>Cluster:</b> my-ecs-cluster</p>
    <p><b>Service:</b> wordpress-service</p>
    <p><b>Status:</b> <span class="status">Active</span></p>
    <p><b>Tasks Running:</b> <span id="runningTasks">3</span></p>
    <p><b>Desired Tasks:</b> <span id="desiredTasks">3</span></p>
    <p><b>Pending Tasks:</b> <span id="pendingTasks">0</span></p>
    <canvas id="taskChart" width="400" height="200"></canvas>
  </div>

  <script>
    // Example dynamic values (in real setup, fetch from AWS SDK or API)
    let ecsData = {
      running: 3,
      desired: 3,
      pending: 0
    };

    // Update values in the page
    document.getElementById("runningTasks").textContent = ecsData.running;
    document.getElementById("desiredTasks").textContent = ecsData.desired;
    document.getElementById("pendingTasks").textContent = ecsData.pending;

    // Chart.js to visualize tasks
    const ctx = document.getElementById('taskChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Running', 'Desired', 'Pending'],
        datasets: [{
          data: [ecsData.running, ecsData.desired, ecsData.pending],
          backgroundColor: ['#22c55e','#3b82f6','#f59e0b']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom'
          }
        }
      }
    });
  </script>
</body>
</html>
